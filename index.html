<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Donasi Palestina | Pray for Palestine</title>
  <!-- Font sederhana dan ikon bendera -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0e1a0e 0%, #1a2a1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      margin: 0;
      position: relative;
    }

    /* Background pattern subtle */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(210, 160, 100, 0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 248, 240, 0.95);
      backdrop-filter: blur(12px);
      background: #fef9ed;
      border-radius: 32px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 150, 0.15);
      padding: 32px 28px 36px;
      transition: all 0.2s ease;
      border: 1px solid rgba(212, 175, 55, 0.25);
    }

    /* Header dengan bendera Palestina */
    .palestine-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .flag {
      display: flex;
      flex-direction: column;
      width: 44px;
      height: 30px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .flag div {
      flex: 1;
    }

    .flag .black {
      background: #000000;
    }
    .flag .white {
      background: #ffffff;
    }
    .flag .green {
      background: #007a3d;
    }

    .red-triangle {
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 20px solid #ce1126;
      margin-left: -4px;
    }

    .title-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .title-section h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1e3b1a;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .title-section h1 span {
      background: #d4af37;
      color: #0a1f0a;
      font-size: 0.9rem;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 600;
      letter-spacing: 0.3px;
      background: #e8d49a;
    }

    .prayer-text {
      color: #5a4a2e;
      font-weight: 500;
      font-size: 1rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      padding: 10px 16px;
      border-radius: 60px;
      font-style: italic;
    }

    .divider {
      height: 2px;
      background: linear-gradient(to right, transparent, #b99b4b, #8b7a4c, transparent);
      margin: 20px 0 24px;
      opacity: 0.5;
    }

    .donation-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid #ede3cc;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .label {
      font-weight: 600;
      color: #4a3b2c;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .account-number {
      font-size: 1.9rem;
      font-weight: 700;
      color: #1e2e1a;
      background: #f5f0e3;
      padding: 10px 16px;
      border-radius: 16px;
      letter-spacing: 1.5px;
      text-align: center;
      word-break: break-word;
      border: 1px dashed #b49450;
      margin: 8px 0 4px;
      transition: 0.2s;
    }

    .name-highlight {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d3e1f;
      background: #f9f3e4;
      padding: 8px 16px;
      border-radius: 40px;
      display: inline-block;
      margin: 6px 0 12px;
      border: 1px solid #dbbc6c;
    }

    .copy-btn {
      background: #ffffff;
      border: 1.5px solid #b49450;
      color: #3e4d2b;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: #fefcf5;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .copy-btn:hover {
      background: #d4af37;
      border-color: #a68b3c;
      color: #0a1f0a;
      box-shadow: 0 6px 14px rgba(180, 140, 40, 0.4);
    }

    .copy-btn:active {
      transform: scale(0.96);
    }

    .flex-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
    }

    .dua-text {
      background: #e7dfcc;
      border-radius: 30px;
      padding: 6px 18px;
      font-weight: 500;
      color: #2d3b1c;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
    }

    .message-box {
      margin-top: 20px;
      background: rgba(206, 17, 38, 0.08);
      border-left: 4px solid #ce1126;
      padding: 14px 16px;
      border-radius: 14px;
      color: #3b2e1a;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fef5f0;
    }

    .message-box .icon {
      font-size: 1.6rem;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      color: #6b5d45;
      font-weight: 500;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .watermelon-icon {
      font-size: 1.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    button {
      background: none;
      border: none;
      font-family: inherit;
    }

    .copy-feedback {
      font-size: 0.8rem;
      color: #2b5e1a;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.2s;
      font-weight: 600;
    }

    .copy-feedback.show {
      opacity: 1;
    }

    @media (max-width: 400px) {
      .card {
        padding: 24px 18px;
      }
      .account-number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Bendera & simbol -->
    <div class="palestine-header">
      <div class="flag">
        <div class="black"></div>
        <div class="white"></div>
        <div class="green"></div>
      </div>
      <div class="red-triangle"></div>
      <span style="font-size: 1.8rem; margin-left: 2px;">🇵🇸</span>
    </div>

    <div class="title-section">
      <h1>
        Pray for Palestine
        <span>Donasi</span>
      </h1>
      <div class="prayer-text">
        <span>🕊️</span> Bantu saudara kita di Gaza <span>🕊️</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Kotak donasi utama -->
    <div class="donation-box">
      <div class="info-row">
        <span class="label">📋 Nomor Rekening / Dana</span>
        <span class="dua-text">🇵🇸 Tautkan kebaikan</span>
      </div>
      
      <div class="account-number" id="accountNumber">085218489371</div>
      
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <span class="name-highlight">a.n. testing link</span>
        <button class="copy-btn" id="copyButton">
          <span>📋</span> Salin Nomor
          <span class="copy-feedback" id="copyFeedback">✓ Tersalin</span>
        </button>
      </div>

      <div style="margin-top: 14px; color: #5f4c32; font-size: 0.9rem; display: flex; align-items: center; gap: 6px;">
        <span>🔹</span> Transfer via bank / e-wallet yang mendukung
      </div>

      <!-- Pesan kemanusiaan -->
      <div class="message-box">
        <span class="icon">🤲</span>
        <span><strong>Setetes bantuanmu, harapan bagi mereka.</strong><br><span style="font-size:0.85rem;">#FreePalestine</span></span>
      </div>
    </div>

    <div class="footer-note">
      <span class="watermelon-icon">🍉</span> 
      Dari hati untuk Palestina 
      <span class="watermelon-icon">🍉</span>
    </div>
  </div>

  <script>
    (function() {
      const copyBtn = document.getElementById('copyButton');
      const accountNumberEl = document.getElementById('accountNumber');
      const feedbackEl = document.getElementById('copyFeedback');

      if (!copyBtn || !accountNumberEl || !feedbackEl) return;

      copyBtn.addEventListener('click', async () => {
        const numberToCopy = accountNumberEl.textContent.trim();
        
        try {
          await navigator.clipboard.writeText(numberToCopy);
          
          // Tampilkan feedback
          feedbackEl.classList.add('show');
          
          // Ubah teks tombol sementara (opsional)
          const originalText = copyBtn.innerHTML;
          copyBtn.innerHTML = '<span>✅</span> Tersalin! <span class="copy-feedback show" style="opacity:1; margin-left:4px;">✓</span>';
          
          setTimeout(() => {
            feedbackEl.classList.remove('show');
            // Kembalikan tampilan tombol
            copyBtn.innerHTML = '<span>📋</span> Salin Nomor <span class="copy-feedback" id="copyFeedback">✓ Tersalin</span>';
            // Pasang kembali referensi elemen feedback (karena innerHTML di-reset)
            const newFeedback = document.getElementById('copyFeedback');
            if (newFeedback) {
              // update referensi global jika diperlukan, tapi kita hanya pakai lokal
              // cukup jaga agar id tetap sama.
            }
          }, 1800);
          
        } catch (err) {
          // Fallback untuk browser lama
          const textArea = document.createElement('textarea');
          textArea.value = numberToCopy;
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            feedbackEl.classList.add('show');
            setTimeout(() => feedbackEl.classList.remove('show'), 1500);
          } catch (e) {
            alert('Gagal menyalin, silakan salin manual: ' + numberToCopy);
          }
          document.body.removeChild(textArea);
        }
      });

      // Reset reference feedback setelah potensi render ulang (tetap aman)
    })();
  </script>
</body>
</html>
